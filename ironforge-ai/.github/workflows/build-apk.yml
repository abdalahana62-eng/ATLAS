name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ironforge-ai/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install deps
        working-directory: ironforge-ai
        run: npm ci
      - name: Build web (Capacitor static export)
        working-directory: ironforge-ai
        env:
          BUILD_TARGET: capacitor
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_VERSION: ${{ github.ref_name }}
        run: npm run build
      - name: Sync Capacitor
        working-directory: ironforge-ai
        run: |
          npx cap add android || true
          npx cap sync android
      - name: Build APK (release)
        working-directory: ironforge-ai/android
        # SECURITY: release build only (debuggable=false). Debug APKs allow
        # USB debugging + tampering. Sign via ANDROID_KEYSTORE_* secrets.
        run: ./gradlew assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-release-apk
          path: ironforge-ai/android/app/build/outputs/apk/release/app-release*.apk
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: ironforge-ai/android/app/build/outputs/apk/release/app-release*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
