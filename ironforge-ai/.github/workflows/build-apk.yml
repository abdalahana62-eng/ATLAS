name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ironforge-ai/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install deps
        working-directory: ironforge-ai
        run: npm ci
      - name: Build web
        working-directory: ironforge-ai
        run: npm run build
      - name: Sync Capacitor
        working-directory: ironforge-ai
        run: |
          npx cap add android || true
          npx cap sync android
      - name: Build APK
        working-directory: ironforge-ai/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ironforge-debug-apk
          path: ironforge-ai/android/app/build/outputs/apk/debug/app-debug.apk
