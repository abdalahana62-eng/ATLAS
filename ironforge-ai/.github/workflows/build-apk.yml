name: Build Play AAB + APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ironforge-ai/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install deps
        working-directory: ironforge-ai
        run: npm ci
      - name: Build web (Capacitor static export)
        working-directory: ironforge-ai
        env:
          BUILD_TARGET: capacitor
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_VERSION: ${{ github.ref_name }}
          APP_VERSION: ${{ github.ref_name }}
        run: npm run build
      - name: Sync Capacitor + patch for Play
        working-directory: ironforge-ai
        run: |
          npx cap add android || true
          npx cap sync android
          node scripts/patch-android-manifest.js
        env:
          APP_VERSION: ${{ github.ref_name }}
          NEXT_PUBLIC_APP_VERSION: ${{ github.ref_name }}
      - name: Build AAB (Google Play) + APK (sideload)
        working-directory: ironforge-ai/android
        # AAB هو المطلوب لرفع بلاي. APK يفضل موجود للتحميل من الموقع.
        # التوقيع ثابت من resources/debug.keystore — أول رفع فعّل Play App Signing
        # وبعدها جوجل يدير توقيع التوزيع وكل رفع يبقى تحديث بدون حذف.
        run: ./gradlew bundleRelease assembleRelease
      - name: Upload artifacts (AAB + APK)
        uses: actions/upload-artifact@v4
        with:
          name: atlas-play-aab-apk
          path: |
            ironforge-ai/android/app/build/outputs/bundle/release/app-release.aab
            ironforge-ai/android/app/build/outputs/apk/release/app-release*.apk
      - name: Upload to Release (AAB + APK)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ironforge-ai/android/app/build/outputs/bundle/release/app-release.aab
            ironforge-ai/android/app/build/outputs/apk/release/app-release*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
