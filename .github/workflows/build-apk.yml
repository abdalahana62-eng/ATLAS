name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ironforge-ai/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install deps
        working-directory: ironforge-ai
        run: npm ci
      - name: Build web
        working-directory: ironforge-ai
        run: npm run build
        env:
          BUILD_TARGET: capacitor
      - name: Fix web assets for Capacitor
        working-directory: ironforge-ai
        run: |
          echo "Checking out/ contents..."
          ls -la out || echo "out missing!"
          ls -la out/en || echo "out/en missing!"
          if [ ! -f out/index.html ]; then
            echo "Creating out/index.html redirect for Capacitor..."
            cat > out/index.html << 'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=en/">
            <script>try{var l=(navigator.language||navigator.userLanguage||'en').toLowerCase();if(l.indexOf('ar')===0)location.href='ar/';else location.href='en/';}catch(e){location.href='en/';}</script>
            <title>ATLAS</title>
          </head>
          <body style="background:#05070b;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh">Redirecting to ATLAS...</body>
          </html>
          HTML
          fi
          echo "--- out/index.html ---"
          cat out/index.html
          echo "--- out structure ---"
          ls -R out | head -n 80
      - name: Sync Capacitor
        working-directory: ironforge-ai
        run: |
          npx cap add android || true
          npx cap sync android
      - name: Build APK
        working-directory: ironforge-ai/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-debug-apk
          path: ironforge-ai/android/app/build/outputs/apk/debug/app-debug.apk
