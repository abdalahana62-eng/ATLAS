name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ironforge-ai/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install deps
        working-directory: ironforge-ai
        run: npm ci
      - name: Build web
        working-directory: ironforge-ai
        run: npm run build
        env:
          BUILD_TARGET: capacitor
      - name: Fix web assets for Capacitor
        working-directory: ironforge-ai
        run: |
          echo "Checking out/ contents..."
          ls -la out || echo "out missing!"
          ls -la out/en || echo "out/en missing!"
          if [ ! -f out/index.html ] || ! grep -q "ATLAS" out/index.html; then
            echo "Fixing out/index.html for Capacitor WebView..."
            cp out/en/index.html out/index.html
            cp -r out/en/* out/ 2>/dev/null || true
            echo "Fixed - copied en to root"
          fi
          echo "--- out/index.html head ---"
          head -n 20 out/index.html
          echo "--- out structure ---"
          ls -R out | head -n 80
      - name: Sync Capacitor
        working-directory: ironforge-ai
        run: |
          npx cap add android || true
          npx cap sync android
      - name: Apply custom icon
        working-directory: ironforge-ai
        run: |
          if [ -f resources/icon.png ]; then
            echo "Found custom icon, generating mipmap..."
            pip install Pillow -q
            python3 scripts/generate-icons.py
            ls -la android/app/src/main/res/mipmap-xxxhdpi/
          else
            echo "No custom icon at resources/icon.png, using default"
          fi
      - name: Build APK
        working-directory: ironforge-ai/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-debug-apk
          path: ironforge-ai/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ATLAS v1.0.${{ github.run_number }}
          body: "APK جديد - حمّل app-debug.apk وثبته. التحديث يظهر تلقائياً في التطبيق عند وجود نت."
          files: ironforge-ai/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
