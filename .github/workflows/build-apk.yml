name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ironforge-ai/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install deps
        working-directory: ironforge-ai
        run: npm ci
      - name: Build web
        working-directory: ironforge-ai
        run: npm run build
        env:
          BUILD_TARGET: capacitor
          NEXT_PUBLIC_APP_VERSION: 1.0.${{ github.run_number }}
          NEXT_PUBLIC_VERCEL_URL: atlas2-ochre.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Fix web assets for Capacitor
        working-directory: ironforge-ai
        run: |
          echo "Checking out/ contents..."
          ls -la out || echo "out missing!"
          ls -la out/ar || echo "out/ar missing!"
          if [ ! -f out/index.html ] || ! grep -q "ATLAS" out/index.html; then
            echo "Fixing out/ root with Arabic (default locale) pages..."
            cp out/ar/index.html out/index.html
            cp out/ar/index.txt out/ 2>/dev/null || true
            for d in out/ar/*/; do
              name=$(basename "$d")
              if [ "$name" = "auth" ]; then
                mkdir -p out/auth
                cp -r out/ar/auth/login out/ar/auth/signup out/auth/ 2>/dev/null || true
              else
                cp -r "out/ar/$name" "out/$name"
              fi
            done
            echo "Fixed - copied ar to root (kept top-level /auth/callback)"
          fi
          echo "--- out/index.html head ---"
          head -n 20 out/index.html
          echo "--- out structure ---"
          ls -R out | head -n 80
      - name: Sync Capacitor
        working-directory: ironforge-ai
        run: |
          npx cap add android || true
          npx cap sync android
      - name: Patch Android deep link
        working-directory: ironforge-ai
        run: node scripts/patch-android-manifest.js
      - name: Apply custom icon
        working-directory: ironforge-ai
        run: |
          if [ -f resources/icon.png ]; then
            echo "Found custom icon, generating mipmap..."
            pip install Pillow -q
            python3 scripts/generate-icons.py
            ls -la android/app/src/main/res/mipmap-xxxhdpi/
          else
            echo "No custom icon at resources/icon.png, using default"
          fi
      - name: Build APK
        working-directory: ironforge-ai/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-debug-apk
          path: ironforge-ai/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ATLAS v1.0.${{ github.run_number }}
          body: "APK جديد - حمّل app-debug.apk وثبته. التحديث يظهر تلقائياً في التطبيق عند وجود نت."
          files: ironforge-ai/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
